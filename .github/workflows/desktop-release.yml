name: OmniSynth Desktop Release

# Never publishes or activates an updater. The protected environment must be
# configured by the owner before use; see docs/MACOS_RELEASE.md.
on:
  workflow_dispatch:
    inputs:
      create_draft:
        description: Create a private draft release in THIS repository after QA
        type: boolean
        default: false
        required: true

permissions:
  contents: read

concurrency:
  group: omnisynth-signed-release
  cancel-in-progress: false

jobs:
  signed:
    runs-on: macos-15
    environment: omnisynth-release
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.23.4
      - run: bun install --frozen-lockfile
      - run: bun run test:release
      - run: bun test scripts/conversation.test.ts
      - name: Prepare owner-configured notarization credentials
        env:
          MAC_CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          MAC_CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          set -euo pipefail
          for name in MAC_CSC_LINK MAC_CSC_KEY_PASSWORD APPLE_API_KEY_P8 APPLE_API_KEY_ID APPLE_API_ISSUER; do
            if [ -z "${!name}" ]; then
              echo "::error::Required secret $name is missing; see docs/MACOS_RELEASE.md"
              exit 1
            fi
          done
          umask 077
          printf '%s' "$APPLE_API_KEY_P8" > "$RUNNER_TEMP/omnisynth-notary.p8"
      - name: Build, sign and notarize OmniSynth
        env:
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_API_KEY: ${{ runner.temp }}/omnisynth-notary.p8
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: bun run dist
      - name: Verify signature, notarization, DMG/ZIP payload and packaged UI
        run: node scripts/verify-macos.mjs
      - name: Verify continuing producer conversation (isolated model fixture)
        run: node scripts/conversation-smoke.mjs .tmp/conversation-qa
      - name: Retain private signed artifacts and evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: omnisynth-signed-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            release/*.dmg
            release/*.zip
            release/SHA256SUMS.txt
            release/provenance.json
            release/package-qa*
            .tmp/conversation-qa/conversation.png
            .tmp/conversation-qa/proof.json
          if-no-files-found: error
          retention-days: 14
      - name: Retain failed package QA diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: omnisynth-failed-qa-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            release/package-qa*
            release/*.dmg
            release/*.zip
            release/SHA256SUMS.txt
            release/provenance.json
            .tmp/conversation-qa/failure.png
          if-no-files-found: ignore
          retention-days: 14
      - name: Remove temporary notarization key
        if: always()
        run: rm -f "$RUNNER_TEMP/omnisynth-notary.p8"

  draft:
    if: ${{ inputs.create_draft }}
    needs: signed
    runs-on: ubuntu-latest
    environment: omnisynth-release
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: omnisynth-signed-${{ github.sha }}-${{ github.run_attempt }}
          path: release
      - name: Create reviewable draft only
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SOURCE_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          test "$GH_REPO" = omniaura/omnisynth
          cd release
          sha256sum --check SHA256SUMS.txt
          jq -e --arg sha "$SOURCE_SHA" '.sourceSha == $sha and .signed == true and .notarizationVerified == true and .published == false and .updaterEnabled == false' provenance.json
          version="$(jq -r .version provenance.json)"
          tag="omnisynth-v$version-${SOURCE_SHA:0:9}-$RUN_ID"
          notes="$RUNNER_TEMP/omnisynth-release-notes.md"
          {
            echo "OmniSynth $version for macOS (Apple silicon)."
            echo
            echo "Built from omniaura/omnisynth $SOURCE_SHA."
            echo "Developer ID signing, notarization, DMG/ZIP payload checks and isolated packaged UI QA passed."
            echo "Draft for owner review. Public distribution, license clearance and updater activation remain separate decisions."
          } > "$notes"
          gh release create "$tag" --target "$SOURCE_SHA" --draft --prerelease \
            --title "OmniSynth $version (review candidate)" --notes-file "$notes" \
            ./*.dmg ./*.zip SHA256SUMS.txt provenance.json package-qa.json package-qa.png
