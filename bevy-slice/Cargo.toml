[package]
name = "omnisynth-bevy-slice"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT"
description = "Independent native OmniSynth synthesis, sequencer and agent-control experiment"
publish = false

[dependencies]
bevy = { version = "=0.19.1", default-features = false, features = ["std", "default_app", "2d_bevy_render", "bevy_winit", "x11", "default_font", "multi_threaded"] }
cpal = "=0.17.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
getrandom = "0.3"
ctrlc = "3.4"
hound = "3.5"

[profile.dev]
debug = 0

[profile.test]
debug = 0
