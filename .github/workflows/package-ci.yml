name: OmniSynth Package QA

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: omnisynth-package-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.23.4
      - run: bun install --frozen-lockfile
      - run: bun run test:release
      - run: bun test scripts/conversation.test.ts
      - name: Build unsigned package (no signing credentials)
        run: bun run dist:unsigned
      - name: Verify DMG, ZIP and packaged UI
        run: node scripts/verify-macos.mjs --unsigned
      - name: Verify continuing producer conversation (isolated model fixture)
        run: node scripts/conversation-smoke.mjs .tmp/conversation-qa
      - name: Retain private QA evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: omnisynth-unsigned-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            release/*.dmg
            release/*.zip
            release/SHA256SUMS.txt
            release/provenance.json
            release/package-qa*
            .tmp/conversation-qa/conversation.png
            .tmp/conversation-qa/proof.json
            .tmp/conversation-qa/failure.png
          retention-days: 14
          if-no-files-found: error
